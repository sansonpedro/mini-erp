services:
  postgres:
    image: postgres:16-alpine
    container_name: mini-wms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: miniwms
      POSTGRES_PASSWORD: miniwms_password
      POSTGRES_DB: mini_wms
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
