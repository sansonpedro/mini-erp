allowBuilds:
  '@prisma/engines': true
  core-js: false
  esbuild: true
  prisma: true
  sharp: false
  unrs-resolver: false
  workerd: false
minimumReleaseAgeExclude:
  - '@neon/config@1.10.0'
  - '@neon/sdk@7.7.0'
overrides:
  # Pin Better Auth to the version compatible with the Neon Auth beta.
  '@better-auth/drizzle-adapter': 1.7.7
  better-auth: 1.7.7
  # Keep lodash and zod aligned with the reviewed security baseline.
  lodash: 4.18.1
  zod: 4.6.7
