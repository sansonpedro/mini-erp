name: Integration

on:
  push:
    branches: [main]
  pull_request:

jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: minierp
          POSTGRES_PASSWORD: minierp_password
          POSTGRES_DB: mini_erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U minierp -d mini_erp"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply migrations
        run: pnpm prisma migrate deploy
        env:
          DATABASE_URL: postgresql://minierp:minierp_password@localhost:5432/mini_erp?sslmode=disable
          DATABASE_URL_UNPOOLED: postgresql://minierp:minierp_password@localhost:5432/mini_erp?sslmode=disable
      - name: Run integration tests
        run: pnpm test:integration
        env:
          DATABASE_URL_TEST: postgresql://minierp:minierp_password@localhost:5432/mini_erp?sslmode=disable
